# Builds the Playhead command line as one executable per platform and attaches it, with the library bundles,
# to the GitHub release. Runs when a release is published, or by hand (then the files are kept as workflow artifacts).
name: Command line and library

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/build-cli.js
      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: tar czf playhead-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz -C dist playhead
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/playhead.exe -DestinationPath playhead-cli-${{ runner.os }}-${{ runner.arch }}.zip
      - name: Library bundles
        if: runner.os == 'Linux'
        run: cp dist/playhead-core.js dist/playhead-core.mjs .
      - uses: actions/upload-artifact@v4
        with:
          name: playhead-${{ runner.os }}-${{ runner.arch }}
          path: |
            playhead-cli-*
            playhead-core.*
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" playhead-cli-* $(ls playhead-core.* 2>/dev/null) --clobber
